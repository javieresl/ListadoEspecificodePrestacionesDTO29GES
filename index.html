*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dots) 2px, transparent 2.5px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.45;font-weight:500;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sun)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px;border-radius:12px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Piezas caricaturescas */
.toon{background:var(--card);border:var(--bw) solid var(--stroke);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow)}
.press{transition:transform .08s, box-shadow .08s}
.press:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.blob{flex:none;display:grid;place-items:center;border:var(--bw) solid var(--stroke);border-radius:16px;background:var(--c,var(--soft))}
.blob svg{width:70%;height:70%}
.blob.sm{width:36px;height:36px;border-radius:12px;border-width:2px}
.ico-s{stroke:#1D2B33;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ico-f{fill:#FFFFFF;stroke:#1D2B33;stroke-width:2.2;stroke-linejoin:round}
.ico-d{fill:#1D2B33}

/* Barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sun);color:var(--sun-ink);border-bottom:var(--bw) solid #1D2B33}
.appbar .wrap{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:8px}
.appbar h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0;flex:1;min-width:0;line-height:1.1}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#FFFFFF;color:#1D2B33;border:var(--bw) solid #1D2B33;box-shadow:2px 2px 0 #1D2B33}
.round svg{width:22px;height:22px}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.view{padding-block:18px;display:flex;flex-direction:column;gap:18px}

/* Saludo */
.hello{display:flex;gap:14px;align-items:center;padding:16px}
.hello .mascot{width:76px;height:76px;flex:none}
.hello h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1;margin:0;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--ink-2);font-size:.95rem}

/* Buscador */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--stroke);border-radius:999px;padding:0 8px 0 16px;min-height:56px;box-shadow:4px 4px 0 var(--shadow)}
.search:focus-within{box-shadow:4px 4px 0 var(--accent)}
.search>svg{width:24px;height:24px;flex:none;color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;font-size:1.02rem;color:var(--ink);outline:none;padding:12px 0}
.search input::placeholder{color:var(--ink-3);font-weight:500}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid var(--stroke)}
.x svg{width:16px;height:16px}

.h{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.h small{font-family:var(--f-body);font-size:.85rem;font-weight:700;color:var(--ink-2)}

/* Temas (categorías) */
.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 6px 10px;margin-inline:-6px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.78rem;font-weight:800;line-height:1.15}
.cat .blob{width:64px;height:64px;border-radius:20px;box-shadow:3px 3px 0 var(--shadow)}
.cat[aria-pressed="true"] .blob{outline:3px solid var(--accent);outline-offset:3px}
.cat[aria-pressed="true"] span:last-child{color:var(--accent)}

/* Lista de problemas */
.plist{display:flex;flex-direction:column;gap:12px}
.prob{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px;padding-right:6px}
.prob>a{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 4px 12px 12px;text-decoration:none;min-width:0}
.prob .blob{width:54px;height:54px;position:relative}
.nbadge{position:absolute;right:-10px;bottom:-10px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--sun);color:#1D2B33;border:2px solid #1D2B33;font-family:var(--f-display);font-weight:800;font-size:.85rem;display:grid;place-items:center;line-height:1}
.prob .t{font-weight:800;line-height:1.25;min-width:0}
.prob .m{display:block;font-size:.84rem;color:var(--ink-2);margin-top:3px;font-weight:700}
.star{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.star svg{width:26px;height:26px}
.star[aria-pressed="true"] svg{fill:var(--sun);stroke:#1D2B33}

/* Ficha del problema */
.hero{padding:18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero .row{display:flex;gap:14px;align-items:center;width:100%}
.hero .blob{width:72px;height:72px;border-radius:22px}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.12;margin:0;flex:1;min-width:0;text-wrap:balance}
.tagline{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--stroke);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;background:var(--soft)}
.pill.sun{background:var(--sun);color:#1D2B33;border-color:#1D2B33}

/* Pestañas de intervención */
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 6px 8px;margin-inline:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid var(--stroke);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;background:var(--card);box-shadow:3px 3px 0 var(--shadow);min-height:46px;white-space:nowrap}
.tab .ic{width:32px;height:32px;border-radius:50%;border:2px solid #1D2B33;display:grid;place-items:center;background:var(--c,var(--soft))}
.tab .ic svg{width:20px;height:20px}
.tab[aria-pressed="true"]{background:var(--c,var(--sun));color:#1D2B33}
.tab .n{font-size:.8rem;opacity:.75}

/* Prestaciones */
.prs{display:flex;flex-direction:column;gap:12px}
.pr{overflow:hidden}
.pr>.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px}
.pr .ic{width:40px;height:40px;border-radius:50%;border:2px solid #1D2B33;display:grid;place-items:center;background:var(--c)}
.pr .ic svg{width:24px;height:24px}
.pr .nm{font-weight:800;line-height:1.25;min-width:0}
.pr .sub{display:block;font-size:.82rem;color:var(--ink-2);font-weight:700;margin-top:2px}
.pr .chev{width:34px;height:34px;border-radius:50%;background:var(--soft);border:2px solid var(--stroke);display:grid;place-items:center;transition:transform .2s}
.pr .chev svg{width:18px;height:18px}
.pr[data-open="1"] .chev{transform:rotate(180deg);background:var(--sun);border-color:#1D2B33;color:#1D2B33}
.gl{list-style:none;margin:0;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--stroke);background:var(--soft)}
.g{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--card);border:2px solid var(--stroke)}
.g .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--c);border:2px solid #1D2B33}
.g .tx{min-width:0;overflow-wrap:anywhere;font-weight:700}
.g .ob{display:block;margin-top:4px;font-size:.84rem;color:var(--ink-2);font-weight:500;font-style:italic}
.sym{display:inline-block;font-size:.72rem;font-weight:800;border:1.5px solid var(--stroke);border-radius:6px;padding:0 5px;margin-right:6px;color:var(--ink-2);vertical-align:1px;background:var(--soft)}
.mult{font-weight:800;font-size:.8rem;background:var(--sun);color:#1D2B33;border:2px solid #1D2B33;border-radius:10px;padding:0 6px}
.note{font-size:.85rem;color:var(--ink-2);font-weight:700;padding:10px 2px 0}
mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.minisearch{min-height:48px;box-shadow:3px 3px 0 var(--shadow)}

/* Resultados */
.res{display:flex;flex-direction:column;gap:4px;padding:12px 14px;text-align:left;width:100%;text-decoration:none}
.crumb{font-size:.83rem;color:var(--ink-2);font-weight:700;line-height:1.35}
.crumb b{background:var(--sun);color:#1D2B33;border-radius:6px;padding:0 5px;font-weight:800}
.more{align-self:center;padding:10px 20px;font-weight:800;min-height:46px;text-decoration:none;display:inline-block}
.empty{padding:24px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .mascot{width:96px;height:96px}
.empty b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;line-height:1.15}
.empty span{color:var(--ink-2);max-width:40ch}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.chip{border:2px solid var(--stroke);border-radius:999px;padding:6px 14px;font-weight:800;background:var(--card);min-height:40px;box-shadow:2px 2px 0 var(--shadow)}
.chip[aria-pressed="true"]{background:var(--sun);color:#1D2B33;border-color:#1D2B33}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 6px 6px;margin-inline:-6px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;white-space:nowrap}

/* Datos */
.card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0}
.card p,.card li{margin:0;color:var(--ink-2);font-size:.94rem;max-width:65ch}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.94rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px}
.seg .chip{flex:1}

/* Ayudas en lenguaje simple */
.hint{margin:-8px 2px 0;color:var(--ink-2);font-weight:700;font-size:.93rem;max-width:60ch}
.gloss{display:flex;flex-direction:column;gap:12px;margin:0}
.gloss div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.gloss dt{font-family:var(--f-display);font-weight:800;font-size:1.08rem;line-height:1.15}
.gloss dd{margin:2px 0 0;color:var(--ink-2);font-size:.95rem}
.gloss .blob{width:44px;height:44px;border-radius:14px}

/* Tipos de glosa */
.tg{display:flex;flex-direction:column;gap:8px}
.th{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.02rem;padding-top:8px}
.th small{font-family:var(--f-body);font-size:.8rem;color:var(--ink-2);font-weight:700}
.tic{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #1D2B33;background:var(--c);display:grid;place-items:center}
.tic svg{width:19px;height:19px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.tpill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--stroke);border-radius:999px;padding:2px 11px 2px 3px;font-weight:800;font-size:.83rem;background:var(--card)}
.tpill .tic{width:26px;height:26px}
.tpill .tic svg{width:16px;height:16px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:#1D2B33;border:var(--bw) solid #1D2B33;border-radius:999px;padding:6px 18px 6px 8px;font-weight:800;box-shadow:3px 3px 0 #1D2B33;min-height:48px}
.cta .tic{background:#FFFFFF;width:32px;height:32px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.opt .blob{width:46px;height:46px;border-radius:14px}
.opt b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.15}
.opt span span{display:block;font-size:.85rem;color:var(--ink-2);font-weight:600}
.foot{text-align:center;font-size:.8rem;color:var(--ink-3);font-weight:700;padding:4px 8px;user-select:none;-webkit-user-select:none}
.appbar .round svg{width:22px;height:22px}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:var(--bw) solid var(--stroke);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:.76rem;font-weight:800;color:var(--ink-2)}
.nav a .p{width:58px;height:34px;border-radius:17px;display:grid;place-items:center;border:2px solid transparent}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] .p{background:var(--sun);border-color:#1D2B33;color:#1D2B33;box-shadow:2px 2px 0 #1D2B33}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:var(--bw) solid var(--stroke);border-radius:26px 26px 0 0;max-height:84%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .inner{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-height:0}
.grab{width:44px;height:6px;border-radius:3px;background:var(--stroke);margin:10px auto 2px}
.sh{padding:8px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.sh h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.2rem;flex:1;min-width:0;line-height:1.2;overflow-wrap:anywhere}
.sh .round{background:var(--card);color:var(--ink);border-color:var(--stroke);box-shadow:2px 2px 0 var(--shadow)}
.sb{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 22px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--sun);color:#1D2B33;border:var(--bw) solid #1D2B33;box-shadow:3px 3px 0 #1D2B33;padding:8px 18px;border-radius:999px;z-index:50;font-weight:800;max-width:calc(100% - 32px)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.star[aria-pressed="true"] svg{animation:pop .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Utilidades de texto ---------- */
const qwords = q => norm(q).split(/\s+/).filter(Boolean);
const matchAll = (t, w) => w.every(x => t.includes(x));
function hl(text, q){
  const t = esc(text); if(!q) return t;
  const words = qwords(q).filter(w=>w.length>1); if(!words.length) return t;
  const nt = norm(text), marks = [];
  words.forEach(w => { let i = 0; while((i = nt.indexOf(w, i)) !== -1){ marks.push([i, i+w.length]); i += w.length; } });
  if(!marks.length) return t;
  marks.sort((a,b)=>a[0]-b[0]);
  const m2 = []; marks.forEach(m => { const l = m2[m2.length-1]; if(l && m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else m2.push(m.slice()); });
  let out = '', pos = 0; m2.forEach(([a,b]) => { out += esc(text.slice(pos,a)) + '<mark>' + esc(text.slice(a,b)) + '</mark>'; pos = b; });
  return out + esc(text.slice(pos));
}
function glosaHTML(gi, q){ return hl(cleanG(gi), q); }

}

}
function renderPrest(p, s){
  const w = qwords(s.q); let html = '', shown = 0;
  p.I.filter(i => s.int==='__all' || i.name===s.int || w.length).forEach(i => i.prest.forEach(pr => {
    let gl = pr.gl, filtered = 0, force = false;
    if(w.length){
      const nameHit = matchAll(pr.key, w);
      if(!nameHit){
        gl = pr.gl.filter(x => matchAll(x.o>=0 ? SN[x.g]+' '+SN[x.o] : SN[x.g], w));
        if(!gl.length) return;
        filtered = pr.gl.length; force = true;
      }
    }
    shown++;
    const open = w.length ? ((force && !s.closed.has(pr.id)) || s.open.has(pr.id)) : s.open.has(pr.id);
    html += prCard(pr, gl, s.q, open, filtered, w.length || s.int==='__all');
  }));
  $('#psCount').textContent = shown + (shown===1 ? ' prestación' : ' prestaciones') + (w.length ? ' con «'+s.q.trim()+'»' : '');
  $('#prl').innerHTML = html || '<div class="empty toon">'+MASCOT('sad')+'<b>Nada por aquí</b><span>Pruebe otra palabra o elija otra etapa.</span></div>';
}
function typeCounts(p){
  const c = {}; p.I.forEach(i => i.prest.forEach(pr => pr.gl.forEach(x => c[x.t] = (c[x.t]||0) + 1)));
  return TORDER.filter(k => c[k]).map(k => [k, c[k]]);
}
const SHORT = {E:['examen','exámenes'],M:['medicamento','medicamentos'],C:['consulta o atención','consultas y atenciones'],P:['procedimiento','procedimientos'],H:['hospitalización','hospitalización'],I:['insumo','insumos'],N:['alimento especial','alimentos especiales'],O:['otra prestación','otras prestaciones']};
const shortT = (k, c) => (SHORT[k] || SHORT.O)[c === 1 ? 0 : 1];
function prCard(pr, gl, q, open, filtered, showStage){
  const total = pr.gl.length;
  const kinds = TORDER.filter(k => pr.gl.some(x => x.t === k));
  return '<article class="pr toon" style="--c:'+icol(pr.iname)+'" data-open="'+(open?1:0)+'" data-pid="'+esc(pr.id)+'">'
    + '<button class="hdr" data-toggle aria-expanded="'+open+'"><span class="ic">'+iico(pr.iname)+'</span>'
    + '<span style="min-width:0"><span class="nm">'+hl(cap(pr.name),q)+'</span><span class="sub">'+(showStage ? esc(pr.iname)+' · ' : '')+plural(total,'elemento','elementos')+' · '+kinds.map(k=>shortT(k,2)).join(', ')+'</span></span>'
    + '<span class="chev">'+IC.chev+'</span></button>'
    + (open ? glList(pr, gl, q, filtered) : '') + '</article>';
}
function glList(pr, gl, q, filtered){
  let html = '<ul class="gl">' + (filtered ? '<li class="note">'+gl.length+' de '+filtered+' coinciden con su búsqueda</li>' : '');
  TORDER.forEach(k => {
    const items = gl.filter(x => x.t === k); if(!items.length) return;
    html += '<li class="tg" style="--c:var(--t-'+k+')"><div class="th">'+tic(k)+tlabel(k)+' <small>'+items.length+'</small></div>'
      + items.map(x => '<button class="g" data-g="'+x.g+'" data-from="'+esc(pr.id)+'"><span class="dot"></span><span class="tx">'+glosaHTML(x.g,q)
        + (x.o>=0 ? '<span class="ob">'+hl(cap(S[x.o]),q)+'</span>' : '')+'</span><span></span></button>').join('')
      + '</li>';
  });
  return html + '</ul>';
}

function renderResults(){

    types.innerHTML = '';

  }
  const rp = P.filter(p => matchAll(p.key, w));
  const rr = []; prestById.forEach(pr => { if(matchAll(pr.key, w)) rr.push(pr); });
  const gmap = new Map();
  prestById.forEach(pr => pr.gl.forEach(x => {
    if(matchAll(x.o>=0 ? SN[x.g]+' '+SN[x.o] : SN[x.g], w)){ if(!gmap.has(x.g)) gmap.set(x.g, new Set()); gmap.get(x.g).add(pr); }
  }));
  const rg = [...gmap.entries()].map(([g,set])=>({g, locs:[...set]})).sort((a,b)=>b.locs.length-a.locs.length);
  const counts = {todo: rp.length+rr.length+rg.length, p: rp.length, r: rr.length, g: rg.length};
  if(st.qType!=='todo' && !counts[st.qType]) st.qType = 'todo';
  types.innerHTML = [['todo','Todo'],['p','Problemas'],['r','Prestaciones'],['g','Elementos']].map(([k,l]) =>
    '<button class="chip" data-qt="'+k+'" aria-pressed="'+(st.qType===k)+'">'+l+' · '+fmt(counts[k])+'</button>').join('');
  types.querySelectorAll('[data-qt]').forEach(b=>b.addEventListener('click',()=>{ st.qType=b.dataset.qt; renderResults(); }));
  if(!counts.todo){ box.innerHTML = '<div class="empty toon">'+MASCOT('sad')+'<b>Sin resultados para «'+esc(q)+'»</b><span>Pruebe con una palabra más corta, por ejemplo «ecograf».</span></div>'; return; }
  const show = k => st.qType==='todo' || st.qType===k;

  if(show('p') && rp.length){

  }
  if(show('r') && rr.length){

    html += '<div class="view" style="padding:0;gap:12px"><h3 class="h">Prestaciones <small>'+rr.length+'</small></h3>'
      + rr.slice(0,L).map(pr => '<a class="res toon press" href="#ps-'+pr.p.n+'" data-openp="'+esc(pr.id)+'"><span style="font-weight:800">'+hl(cap(pr.name),q)+'</span><span class="crumb"><b>'+pr.p.n+'</b> '+esc(pr.p.name)+' · '+esc(pr.iname)+'</span></a>').join('')
      + more('r',rr.length,L)+'</div>';

    html += '<div class="view" style="padding:0;gap:12px"><h3 class="h">Exámenes, medicamentos y otros <small>'+fmt(rg.length)+'</small></h3>'
      + rg.slice(0,L).map(r => { const ns = [...new Set(r.locs.map(pr=>pr.p.n))];
          return '<button class="res toon press" data-g="'+r.g+'"><span style="font-weight:800">'+glosaHTML(r.g,q)+'</span><span class="crumb">'+tlabel(T[r.g])+' · Está en '+plural(ns.length,'problema','problemas')+': '+ns.slice(0,8).map(n=>'<b>'+n+'</b>').join(' ')+(ns.length>8?' y '+(ns.length-8)+' más':'')+'</span></button>'; }).join('')
      + more('g',rg.length,L)+'</div>';
  }

  box.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{ st.limit[b.dataset.more] = Number(b.dataset.l) + 30; renderResults(); }));
}

/* ---------- Copiar, descargar y compartir ---------- */
function makeFile(name, type, content){ try{ return new File([content], name, {type}); }catch(e){ return null; } }
function download(name, type, content){
  if(viewerDL){
    viewerDL.save({filename: name, data: content}).then(() => toast('Archivo guardado'), err => {
      const c = err && err.code;
      if(c === 'declined') return;
      if(c === 'rate_limited') { toast('Espere un momento e intente de nuevo'); return; }
      copyText(content, 'No se pudo descargar aquí; el contenido quedó copiado');
    });
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Descargando ' + name);
  }catch(e){ copyText(content, 'No se pudo descargar; el contenido quedó copiado'); }
}
function copyText(txt, okMsg){
  const fallback = () => {
    $('#sheetTitle').textContent = 'Copie el texto';
    $('#sheetBody').innerHTML = '<p class="crumb" style="margin:0">No se pudo copiar automáticamente. Mantenga presionado el texto y elija «Copiar».</p><textarea id="copyArea" readonly style="width:100%;min-height:50vh;font:inherit;font-size:.85rem;border:2px solid var(--stroke);border-radius:14px;padding:10px;background:var(--card);color:var(--ink)"></textarea>';
    $('#copyArea').value = txt; showSheet(); try{ $('#copyArea').select(); }catch(e){}
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast(okMsg), fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function exportData(p, onlyInt){
  const ints = p.I.filter(i => !onlyInt || i.name === onlyInt);
  const rows = [], lines = [];
  lines.push('Problema de salud GES N° '+p.n+': '+p.name, '');
  ints.forEach(i => {
    lines.push('== '+i.name.toUpperCase()+' ==', '');
    i.prest.forEach((pr, k) => {
      lines.push((k+1)+'. '+cap(pr.name));
      TORDER.forEach(tk => {
        const items = pr.gl.filter(x => x.t === tk); if(!items.length) return;
        lines.push('   '+tlabel(tk)+':');
        items.forEach(x => {
          const ob = x.o>=0 ? cap(S[x.o]) : '';
          lines.push('   • '+cleanG(x.g)+(ob ? ' ('+ob+')' : ''));
          rows.push([p.n, p.name, i.name, cap(pr.name), tlabel(tk), cleanG(x.g), ob]);
        });
      });
      lines.push('');
    });
  });
  lines.push('Fuente: listado LEP 29 (2025). Información referencial; enviado desde Explorador LEP 29.');
  const head = ['N°','Problema de salud','Intervención sanitaria','Prestación o grupo de prestaciones','Tipo de elemento','Elemento (glosa)','Observación'];
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const csv = '﻿' + [head].concat(rows).map(r => r.map(q).join(';')).join('\r\n') + '\r\n';
  const tsv = [head].concat(rows).map(r => r.map(v => String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  const nPrest = ints.reduce((a,i)=>a+i.prest.length,0);
  return {text: lines.join('\n'), csv, tsv, nPrest, nRows: rows.length};
}

    }
    html += '<p class="crumb" style="margin:0">Incluye '+plural(d.nPrest,'prestación','prestaciones')+' y '+plural(d.nRows,'elemento','elementos')+'.</p>';
    const icons = {
      txt: sv('<path class="ico-f" d="M5 8h22v16H5z"/><path class="ico-s" d="M5 8l11 9 11-9"/>'),
      csv: sv('<rect class="ico-f" x="5" y="5" width="22" height="22" rx="3"/><path class="ico-s" d="M5 12h22M5 19h22M13 5v22"/>'),
      dl: sv('<path class="ico-s" d="M16 5v14M10 13l6 6 6-6"/><path class="ico-f" d="M6 22h20v5H6z"/>'),

    };
    const button = (id, color, ic, title, sub) => '<button class="opt toon press" id="'+id+'"><span class="blob" style="--c:'+color+'">'+ic+'</span><span><b>'+title+'</b><span>'+sub+'</span></span></button>';
    const csvFile = makeFile(fname, 'text/csv', d.csv);
    if(navigator.share){

        html += button('shCsv','var(--t-M)',icons.csv,'Enviar como tabla','Archivo para Excel o Google Sheets (.csv)');
    }
    if(canDownload()){
      html += button('dlCsv','var(--t-H)',icons.dl,'Descargar tabla','Archivo .csv para Excel o Google Sheets')
        + button('dlTxt','var(--t-N)',icons.dl,'Descargar texto','Archivo .txt para leer o imprimir');
    }
    html += button('cpTxt','var(--t-C)',icons.cpy,'Copiar texto','Para pegarlo en un correo o mensaje')
      + button('cpTab','var(--t-I)',icons.csv,'Copiar como tabla','Para pegarla en Excel o Google Sheets');
    $('#sheetBody').innerHTML = html;
    $('#sheetBody').querySelectorAll('[data-only]').forEach(b => b.addEventListener('click', () => { only = b.dataset.only; draw(); }));
    const on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
    const shareFail = (err, txt, msg) => { if(!err || err.name !== 'AbortError') copyText(txt, msg); };
    on('shTxt', () => { try{ navigator.share({title: subject, text: d.text}).catch(err => shareFail(err, d.text, 'No se pudo abrir Compartir; el texto quedó copiado')); }catch(err){ shareFail(err, d.text, 'Texto copiado'); } });
    on('shCsv', () => { try{ navigator.share({title: subject, files:[csvFile]}).catch(err => shareFail(err, d.tsv, 'No se pudo enviar el archivo; la tabla quedó copiada')); }catch(err){ shareFail(err, d.tsv, 'Tabla copiada'); } });
    on('dlCsv', () => download(fname, 'text/csv;charset=utf-8', d.csv));
    on('dlTxt', () => download(fname.replace(/\.csv$/, '.txt'), 'text/plain;charset=utf-8', '\uFEFF' + d.text));
    on('cpTxt', () => copyText(d.text, 'Texto copiado'));
    on('cpTab', () => copyText(d.tsv, 'Tabla copiada: péguela en Excel'));
  };
  draw(); showSheet();
}

/* ---------- Hoja: dónde aparece una glosa ---------- */
function openGlosa(g, fromId){
  const locs = [...new Set(where.get(g) || [])];
  const byP = new Map(); locs.forEach(pr => { if(!byP.has(pr.p.n)) byP.set(pr.p.n, []); byP.get(pr.p.n).push(pr); });
  $('#sheetTitle').innerHTML = glosaHTML(g,'');
  let html = '<div class="tagline"><span class="tpill">'+tic(T[g])+tlabel(T[g])+'</span><span class="pill sun">'+plural(byP.size,'problema','problemas')+'</span><span class="pill">'+plural(locs.length,'prestación','prestaciones')+'</span><button class="chip press" id="copyG">Copiar texto</button></div>';
  [...byP.entries()].sort((a,b)=>a[0]-b[0]).forEach(([n, prs]) => {
    const p = byN.get(n);
    html += '<div style="display:flex;gap:10px;align-items:center;margin-top:4px">'+blob(p.cat,'','sm')+'<span class="crumb" style="flex:1;min-width:0"><b>'+n+'</b> '+esc(p.name)+'</span></div>';
    prs.forEach(pr => {
      const obs = [...new Set(pr.gl.filter(x=>x.g===g && x.o>=0).map(x=>S[x.o]))];
      html += '<div style="display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center"><a class="res toon press" href="#ps-'+n+'" data-openp="'+esc(pr.id)+'"'+(pr.id===fromId?' style="background:var(--soft)"':'')+'>'
        + '<span style="font-weight:800">'+esc(cap(pr.name))+'</span><span class="crumb">'+esc(pr.iname)+(obs.length?' · '+esc(obs.join(' / ')):'')+(pr.id===fromId?' · <b>Aquí estaba</b>':'')+'</span></a>'
        + starBtn('r', pr.id, favR.has(pr.id), pr.name)+'</div>';
    });
  });
  $('#sheetBody').innerHTML = html;
  $('#copyG').addEventListener('click', () => copyText(cleanG(g), '¡Copiado!'));
  showSheet();
}
function showSheet(){ $('#scrim').hidden = false; $('#sheet').hidden = false; $('#sheetBody').scrollTop = 0; $('#sheetClose').focus(); }
function closeSheet(){ $('#scrim').hidden = true; $('#sheet').hidden = true; }
$('#scrim').addEventListener('click', closeSheet);
$('#sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 1800); }

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const star = e.target.closest('[data-star]');
  if(star){
    e.preventDefault(); e.stopPropagation();
    const kind = star.dataset.star, set = kind==='p' ? favP : favR, key = kind==='p' ? Number(star.dataset.id) : star.dataset.id;
    const on = !set.has(key); on ? set.add(key) : set.delete(key); saveFav();
    star.setAttribute('aria-pressed', on);
    toast(on ? '¡Guardado en favoritos!' : 'Quitado de favoritos');
    if(route().name==='favoritos' && !on && $('#sheet').hidden) viewFav();
    return;
  }
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const card = tg.closest('.pr'), id = card.dataset.pid, pr = prestById.get(id), r = route(), willOpen = card.dataset.open !== '1';
    if(r.name==='ps'){
      const s = st.ps[r.n];
      if(willOpen){ s.open.add(id); s.closed.delete(id); } else { s.open.delete(id); s.closed.add(id); }
      if(s.q.trim()){ renderPrest(pr.p, s); return; }
      card.outerHTML = prCard(pr, pr.gl, '', willOpen, 0, s.int==='__all');
    } else {
      willOpen ? st.favOpen.add(id) : st.favOpen.delete(id);
      card.outerHTML = prCard(pr, pr.gl, '', willOpen, 0, true);
    }
    return;
  }
  const gb = e.target.closest('[data-g]');
  if(gb){ openGlosa(Number(gb.dataset.g), gb.dataset.from); return; }
  const op = e.target.closest('[data-openp]');
  if(op){
    const pr = prestById.get(op.dataset.openp);
    const s = st.ps[pr.p.n] || (st.ps[pr.p.n] = {int:'', q:'', open:new Set(), closed:new Set()});
    s.int = pr.iname; s.q = ''; s.open.add(pr.id); st.scrollTo = pr.id; closeSheet();
    if(location.hash === '#ps-'+pr.p.n){ e.preventDefault(); render(); }
    return;
  }
  const goq = e.target.closest('[data-goq]');
  if(goq){ st.q = goq.dataset.goq; st.qType = 'todo'; }
});

/* ---------- Rutas ---------- */
function route(){
  const h = location.hash.replace('#',''), m = h.match(/^ps-(\d+)$/);
  if(m) return {name:'ps', n:Number(m[1])};
  if(['buscar','favoritos','notas'].includes(h)) return {name:h};
  return {name:'inicio'};
}
function setBar(title, back){ $('#barTitle').textContent = title; $('#backBtn').hidden = !back; }
let inAppNav = 0, lastRoute = null;
$('#backBtn').addEventListener('click', () => { if(inAppNav > 0) history.back(); else location.hash = 'inicio'; });
function render(){
  const r = route();
  document.querySelectorAll('[data-nav]').forEach(a => { (a.dataset.nav === (r.name==='ps'||r.name==='notas' ? 'inicio' : r.name)) ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  if(r.name==='ps') viewProblem(r.n);
  else if(r.name==='buscar') viewSearch();
  else if(r.name==='favoritos') viewFav();
  else if(r.name==='notas') viewNotes();
  else viewHome();
  if(st.scrollTo){ const id = st.scrollTo, el = [...document.querySelectorAll('[data-pid]')].find(x => x.dataset.pid === id); st.scrollTo = null; if(el) setTimeout(()=>el.scrollIntoView({block:'center'}), 30); }
  else if(r.name !== lastRoute || r.name==='ps') window.scrollTo(0,0);
  lastRoute = r.name;
}
const th = store.get('theme','sistema'); if(th==='light'||th==='dark') document.documentElement.setAttribute('data-theme', th);
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const isDark = () => { const a = document.documentElement.getAttribute('data-theme'); if(a) return a === 'dark'; try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } };
const paintTheme = () => { const d = isDark(); $('#themeBtn').innerHTML = d ? SUN : MOON; $('#themeBtn').setAttribute('aria-label', d ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'); };
$('#helpBtn').addEventListener('click', openHelp);
$('#themeBtn').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store.set('theme', next); paintTheme(); });
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); }catch(e){}
paintTheme();
window.addEventListener('hashchange', () => { inAppNav++; render(); });
/* Modo sin conexión: solo cuando la app está publicada en un sitio web (https) junto a sw.js */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !HOSTED && window.self === window.top && document.querySelector('link[rel="manifest"]')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      if(!store.get('offlineOk', false)){ store.set('offlineOk', true); toast('Lista para usar sin conexión'); }
    }).catch(() => {});
  });
}
render();
})();
</script>
